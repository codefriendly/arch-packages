[__config__]
oldver = "old_ver.json"
newver = "new_ver.json"

[feather-wallet]
source = "github"
github = "feather-wallet/feather"
use_latest_release = true

[sononym]
source = "regex"
url = "https://www.sononym.net/download/"
regex = '''sononym-([0-9.]+)\.tar\.bz2'''

[picard]
source = "git"
git = "https://github.com/metabrainz/picard.git"
include_regex = 'release-((?:\d|\.)+)'
prefix = "release-"
