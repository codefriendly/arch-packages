[__config__]
oldver = "old_ver.json"
newver = "new_ver.json"

[chatgpt-desktop-bin]
source = "regex"
url = "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages"
regex = '''Version:\s*([0-9.]+)'''

[feather-wallet]
source = "github"
github = "feather-wallet/feather"
use_latest_release = true

[sononym]
source = "regex"
url = "https://www.sononym.net/download/"
regex = '''sononym-([0-9.]+)\.tar\.bz2'''
